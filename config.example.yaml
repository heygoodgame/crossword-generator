# Crossword Generator Configuration

puzzle:
  type: mini        # mini or midi
  difficulty: easy  # easy or hard
  grid_size: 5      # 5, 7 for mini; 9, 11 for midi

dictionary:
  path: dictionaries/HggScoredCrosswordList.txt
  min_word_score: 50
  # For midi grids, 2-letter words may need a lower threshold
  min_2letter_score: 30

fill:
  provider: csp
  max_retries: 5
  csp:
    dictionary_path: dictionaries/HggScoredCrosswordList.txt
    min_word_score: 50
    min_2letter_score: 30
    timeout: 30
    # Per-size timeout overrides (seconds). Falls back to `timeout` for unlisted sizes.
    # timeout_by_size:
    #   5: 30
    #   7: 120
    #   9: 300

grading:
  fill:
    min_score: 70           # Minimum overall fill quality score (0-100)
    retry_on_fail: true
    collect_boards: 1       # Collect up to N unique passing boards (1 = stop at first)
    llm_select: false       # Use LLM to pick best board (requires collect_boards > 1)
    # Proper-noun cap: grids with more than max(min_proper_noun_allowance,
    # floor(max_proper_noun_ratio * answer_count)) proper-noun answers are a
    # hard fail. Build the classification file with `classify-proper-nouns`.
    # proper_nouns_path: dictionaries/HggProperNounClassifications.txt
    # max_proper_noun_ratio: 0.15
    # min_proper_noun_allowance: 2
  clue:
    min_score: 70           # Minimum clue quality score (0-100)
    regenerate_on_fail: true
    accuracy_repair_threshold: 12
    individual_repair_score_threshold: 65
    fact_check_enabled: true
    fact_check_scope: risky

llm:
  provider: ollama  # "ollama" or "claude"
  # Route only the clue fact-check pass to a different model family.
  # Empty inherits `provider`. "openai" uses the `openai:` block below —
  # cross-family checking catches confident factual errors that a model
  # grading its own output would pass. Requires the `openai` extra and
  # OPENAI_API_KEY (or OPENAI_API_KEY_CROSSWORD_GENERATOR).
  clue_fact_check_provider: ""
  ollama:
    base_url: "http://localhost:11434"
    model: llama3
    timeout: 120
  claude:
    model: claude-haiku-4-5-20251001
    theme_model: claude-sonnet-5
    clue_generation_model: claude-opus-4-8
    clue_repair_model: claude-opus-4-8
    clue_grading_model: claude-sonnet-5
    clue_fact_check_model: claude-opus-4-8
    puzzle_naming_model: claude-haiku-4-5-20251001
    thinking_enabled: false
    thinking_type: adaptive
    thinking_display: omitted
    thinking_max_tokens: 8192
    effort: ""
    clue_generation_thinking_enabled: true
    clue_generation_effort: medium
    max_tokens: 8192
    timeout: 120
  openai:
    # Cross-family fact-checker. reasoning_effort applies only to
    # o-series / gpt-5 models; temperature applies only to non-reasoning
    # models. Used only when clue_fact_check_provider: openai.
    model: gpt-5
    reasoning_effort: medium
    temperature: 0.2
    max_tokens: 4096
    timeout: 120

output:
  directory: output
  formats:
    - puz
    - ipuz
