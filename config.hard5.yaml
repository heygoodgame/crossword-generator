# Phase 1 hard 5x5 batch-generation config.
# Hard 5x5 draws from the combined Easy+Hard fill (hgg-hard.txt).
# Per Jeff: no 60-point requirement on 5x5.

puzzle:
  type: mini
  difficulty: hard
  grid_size: 5

dictionary:
  path: dictionaries/hgg-hard.txt
  min_word_score: 50
  min_2letter_score: 50
  themed_path: dictionaries/hgg-hard.txt
  themed_min_word_score: 50
  themed_min_2letter_score: 50

fill:
  provider: csp
  max_retries: 5
  max_grid_variants: 100
  csp:
    dictionary_path: dictionaries/hgg-hard.txt
    min_word_score: 50
    min_2letter_score: 50
    timeout: 30
    timeout_by_size:
      5: 30
      7: 120
      9: 300
    quality_tiers: [50]

grading:
  fill:
    min_score: 50
    retry_on_fail: true
    collect_boards: 1
    llm_select: false
    # No two Hard-list entries may cross each other (Jeff, 2026-06).
    hard_cross_words_path: dictionaries/HGGXW-Hard.txt
  clue:
    min_score: 70
    regenerate_on_fail: true
    accuracy_repair_threshold: 12
    individual_repair_score_threshold: 70
    fact_check_enabled: true
    fact_check_scope: risky

llm:
  provider: ollama
  ollama:
    base_url: "http://localhost:11434"
    model: llama3
    timeout: 120
  claude:
    model: claude-haiku-4-5-20251001
    theme_model: claude-sonnet-4-6
    clue_generation_model: claude-sonnet-4-6
    clue_grading_model: claude-haiku-4-5-20251001
    clue_fact_check_model: claude-sonnet-4-6
    thinking_enabled: false
    thinking_type: adaptive
    thinking_display: omitted
    thinking_max_tokens: 8192
    effort: ""
    clue_generation_thinking_enabled: true
    clue_generation_effort: medium
    max_tokens: 4096
    timeout: 120

theme:
  enabled: false

output:
  directory: output/review/hard5
  formats:
    - ipuz
