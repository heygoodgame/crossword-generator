# Phase 1 easy 9x9 batch-generation config.
# Uses HGG Easy only: 3-9 letters, all effective score 50.

puzzle:
  type: midi
  difficulty: easy
  grid_size: 9

dictionary:
  path: dictionaries/hgg-easy.txt
  min_word_score: 50
  min_2letter_score: 50
  themed_path: dictionaries/hgg-easy.txt
  themed_min_word_score: 50
  themed_min_2letter_score: 50

fill:
  provider: csp
  max_retries: 5
  max_grid_variants: 100
  max_long_entries_8_9: 3
  csp:
    dictionary_path: dictionaries/hgg-easy.txt
    min_word_score: 50
    min_2letter_score: 50
    timeout: 30
    timeout_by_size:
      5: 30
      7: 120
      9: 300
    quality_tiers: [50]

grading:
  fill:
    min_score: 50
    retry_on_fail: true
    collect_boards: 1
    llm_select: false
  clue:
    min_score: 70
    regenerate_on_fail: true
    accuracy_repair_threshold: 12
    fact_check_enabled: true
    fact_check_scope: risky

llm:
  provider: ollama
  ollama:
    base_url: "http://localhost:11434"
    model: llama3
    timeout: 120
  claude:
    model: claude-haiku-4-5-20251001
    theme_model: claude-sonnet-4-6
    clue_generation_model: claude-sonnet-4-6
    clue_grading_model: claude-haiku-4-5-20251001
    clue_fact_check_model: claude-sonnet-4-6
    max_tokens: 4096
    timeout: 120

theme:
  enabled: false

output:
  directory: output/review/easy9
  formats:
    - ipuz
