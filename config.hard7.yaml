# Phase 1 hard 7x7 batch-generation config.
# Uses HGG Easy fill plus exactly one 7-letter HGG 60 entry.
# Exactly one 7-letter entry must be a source-score 60 entry.

puzzle:
  type: mini
  difficulty: hard
  grid_size: 7

dictionary:
  path: dictionaries/hgg-hard.txt
  additional_paths:
    - dictionaries/hgg-60.txt
  min_word_score: 50
  min_2letter_score: 50
  themed_path: dictionaries/hgg-hard.txt
  themed_additional_paths:
    - dictionaries/hgg-60.txt
  themed_min_word_score: 50
  themed_min_2letter_score: 50

fill:
  provider: csp
  max_retries: 5
  max_grid_variants: 100
  csp:
    dictionary_path: dictionaries/hgg-hard.txt
    additional_dictionary_paths:
      - dictionaries/hgg-60.txt
    min_word_score: 50
    min_2letter_score: 50
    timeout: 30
    timeout_by_size:
      5: 30
      7: 120
      9: 300
    quality_tiers: [50]

grading:
  fill:
    min_score: 50
    retry_on_fail: true
    collect_boards: 1
    llm_select: false
    exact_score_count_length: 7
    exact_score_count_min_score: 60
    exact_score_count: 1
    # No two Hard-list entries may cross each other (Jeff, 2026-06).
    hard_cross_words_path: dictionaries/HGGXW-Hard.txt
  clue:
    min_score: 70
    regenerate_on_fail: true
    accuracy_repair_threshold: 12
    individual_repair_score_threshold: 70
    fact_check_enabled: true
    fact_check_scope: risky

llm:
  provider: ollama
  ollama:
    base_url: "http://localhost:11434"
    model: llama3
    timeout: 120
  claude:
    model: claude-haiku-4-5-20251001
    theme_model: claude-sonnet-4-6
    clue_generation_model: claude-sonnet-4-6
    clue_grading_model: claude-haiku-4-5-20251001
    clue_fact_check_model: claude-sonnet-4-6
    max_tokens: 4096
    timeout: 120

theme:
  enabled: false

output:
  directory: output/review/hard7
  formats:
    - ipuz
