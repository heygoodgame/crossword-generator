# Starter batch-generation config — "easier than Easy" difficulty tier.
# Fills directly from the raw HGGXW Starter source list (Jeff, 2026-07):
# 4,102 common 3-5 letter words, no scores. This is the quick wiring that
# points straight at the source list rather than a built effective
# dictionary; see the follow-up to fold Starter into
# publish-effective-dictionaries.
#
# Starter clues use the Easy (beginner-friendly) clue register — the pool,
# not the clue difficulty, is what makes Starter easier.

puzzle:
  type: mini
  difficulty: starter
  grid_size: 5

dictionary:
  path: dictionaries/hgg-starter.txt
  min_word_score: 50
  min_2letter_score: 50
  themed_path: dictionaries/hgg-starter.txt
  themed_min_word_score: 50
  themed_min_2letter_score: 50

fill:
  provider: csp
  max_retries: 5
  max_grid_variants: 100
  max_long_entries_8_9: 3
  csp:
    dictionary_path: dictionaries/hgg-starter.txt
    min_word_score: 50
    min_2letter_score: 50
    timeout: 30
    timeout_by_size:
      5: 30
      7: 120
      9: 300
    quality_tiers: [50]

grading:
  fill:
    min_score: 50
    retry_on_fail: true
    collect_boards: 1
    llm_select: false
    # Cap proper-noun answers at max(2, 15% of entries) (Jeff, 2026-07).
    proper_nouns_path: dictionaries/HggProperNounClassifications.txt
  clue:
    min_score: 70
    regenerate_on_fail: true
    accuracy_repair_threshold: 12
    fact_check_enabled: true
    fact_check_scope: risky

llm:
  provider: ollama
  ollama:
    base_url: "http://localhost:11434"
    model: llama3
    timeout: 120
  claude:
    model: claude-haiku-4-5-20251001
    theme_model: claude-sonnet-5
    clue_generation_model: claude-opus-4-8
    clue_repair_model: claude-opus-4-8
    clue_grading_model: claude-sonnet-5
    clue_fact_check_model: claude-opus-4-8
    puzzle_naming_model: claude-haiku-4-5-20251001
    thinking_enabled: false
    thinking_type: adaptive
    thinking_display: omitted
    thinking_max_tokens: 8192
    effort: ""
    clue_generation_thinking_enabled: true
    clue_generation_effort: medium
    max_tokens: 16384
    timeout: 120

theme:
  enabled: false

output:
  directory: output/review/starter
  formats:
    - ipuz
