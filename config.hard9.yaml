# Phase 1 hard 9x9 batch-generation config.
# Uses HGG Easy plus HGG 60 for 8-/9-letter slots.

puzzle:
  type: midi
  difficulty: hard
  grid_size: 9

dictionary:
  path: dictionaries/hgg-easy.txt
  additional_paths:
    - dictionaries/hgg-60.txt
  additional_min_length: 8
  additional_max_length: 9
  min_word_score: 50
  min_2letter_score: 50
  themed_path: dictionaries/hgg-easy.txt
  themed_additional_paths:
    - dictionaries/hgg-60.txt
  themed_additional_min_length: 8
  themed_additional_max_length: 9
  themed_min_word_score: 50
  themed_min_2letter_score: 50

fill:
  provider: csp
  max_retries: 5
  max_grid_variants: 100
  max_long_entries_8_9: 3
  csp:
    dictionary_path: dictionaries/hgg-easy.txt
    additional_dictionary_paths:
      - dictionaries/hgg-60.txt
    additional_dictionary_min_length: 8
    additional_dictionary_max_length: 9
    min_word_score: 50
    min_2letter_score: 50
    min_score_by_length:
      8: 60
      9: 60
    timeout: 30
    timeout_by_size:
      5: 30
      7: 120
      9: 300
    quality_tiers: [50]

grading:
  fill:
    min_score: 50
    retry_on_fail: true
    collect_boards: 1
    llm_select: false
  clue:
    min_score: 70
    regenerate_on_fail: true
    accuracy_repair_threshold: 12

llm:
  provider: ollama
  ollama:
    base_url: "http://localhost:11434"
    model: llama3
    timeout: 120
  claude:
    model: claude-haiku-4-5-20251001
    theme_model: claude-sonnet-4-6
    clue_generation_model: claude-sonnet-4-6
    clue_grading_model: claude-haiku-4-5-20251001
    max_tokens: 4096
    timeout: 120

theme:
  enabled: false

output:
  directory: output/review/hard9
  formats:
    - ipuz
